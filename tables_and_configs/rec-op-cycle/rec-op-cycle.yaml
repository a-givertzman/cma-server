name: App
description: Short explanation / purpose etc.
services:
    retain:
        path: assets/retain/
        point:
            path: point/id.json
            api:
                table: public.tags
                address: 0.0.0.0:8080
                auth-token: 123!@#
                database: crane_data_server


service MultiQueue:
    wait-started: 50 ms         # optional, next service will wait until current completely started plus specified time
    in queue in-queue:
        max-length: 10000
    send-to:
        # - TaskTestReceiver.queue


service CacheService MainCache:
    retain: true
    retain-dely: 30s    # default 30s
    subscribe: 
        /App/MultiQueue: 
            Inf: []             # IMPORTENT !!!


service VirtualDevice VirtualIed15:
    # wait-started: 10 ms         # optional, next service will wait until current completely started plus specified time
    subscribe: /App/MultiQueue
        # /App/MultiQueue:
        #     Inf: []
                # - /App/TestTask/Result.Val1
                # - /App/TestTask/Result.Val2
                # - /App/TestTask/Result.Val3
                # - Result.Value4
    send-to: /App/MultiQueue.in-queue
    path: '/home/ilyarizo/work/cma/cma-server/tables_and_configs/rec-op-cycle/rec-op-cycle-test2.ods'            # Optional, if signal have to be charged from the table
    sheet: 'data'
    api:                                # Optional, if databese access for example required
        address: 127.0.0.1:8081
        database: crane_data_server
        auth-token: 123!@#
    inputs:                             # Input signal to be charged from the specified table file, or calculated in `Task`
        point /App/ied13/db905_visual_data_fast/Winch1.LoadR0: 
            type: Real
            history: rw
        point /App/ied13/db905_visual_data_fast/Winch2.LoadR0: 
            type: Real
            history: rw
        point /App/ied13/db905_visual_data_fast/Winch3.LoadR0: 
            type: Real
            history: rw
        point /App/ied14/db906_visual_data/Winch1.Load: 
            type: Real
            history: rw
        point /App/ied14/db906_visual_data/Winch2.Load: 
            type: Real
            history: rw
        point /App/ied14/db906_visual_data/Winch3.Load: 
            type: Real
            history: rw
    results:
        sql timestamp_start:
            type: String
            sql: "select timestamp_start from rec_operating_cycle order by id desc limit 1;"
            delay:  10ms
        sql timestamp_stop:
            type: String
            sql: "select timestamp_stop from rec_operating_cycle order by id desc limit 1;"
            delay:  10ms
        sql alarm_class:
            type: Int
            sql: "select alarm_class from rec_operating_cycle order by id desc limit 1;"
            delay:  10ms


service ApiClient:
    cycle: 100 ms
    reconnect: 1 s  # default 3 s
    address: 127.0.0.1:8081
    database: crane_data_server
    in queue in-queue:
        max-length: 10000
    auth-token: 123!@#
    # debug: true

