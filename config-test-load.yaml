name: App
description: Short explanation / purpose etc.
services:
    retain:
        path: assets/retain/
        point:
            path: point/id.json
            api:
                table: public.tags
                address: 0.0.0.0:8080
                auth-token: 123!@#
                database: crane_data_server


service MultiQueue:
    wait-started: 50 ms         # optional, next service will wait until current completely started plus specified time
    in queue in-queue:
        max-length: 10000
    send-to:
        # - TaskTestReceiver.queue


service CacheService MainCache:
    retain: true
    retain-dely: 30s    # default 30s
    subscribe: 
        /App/MultiQueue: 
            Inf: []             # IMPORTENT !!!


service VirtualDevice VirtualIed15:
    # wait-started: 10 ms         # optional, next service will wait until current completely started plus specified time
    subscribe: /App/MultiQueue
        # /App/MultiQueue:
        #     Inf: []
                # - /App/TestTask/Result.Val1
                # - /App/TestTask/Result.Val2
                # - /App/TestTask/Result.Val3
                # - Result.Value4
    send-to: /App/MultiQueue.in-queue
    path: './Registrator-test-load.ods'            # Optional, if signal have to be charged from the table
    sheet: 'data'
    api:                                # Optional, if databese access for example required
        address: 0.0.0.0:8080
        database: crane-data-server
        auth-token: 123!@#
    inputs:                             # Input signal to be charged from the specified table file, or calculated in `Task`
        point Winch1.LoadR0: 
            type: Real
            history: rw
        point Winch1.Load: 
            type: Real
            history: rw
        point Winch2.LoadR0: 
            type: Real
            history: rw
        point Winch2.Load: 
            type: Real
            history: rw
        point Winch3.LoadR0: 
            type: Real
            history: rw
        point Winch3.Load: 
            type: Real
            history: rw
    results:
        point Result.CraneTotalLiftedMass:
            type: Real
            sql: "select value from public.rec_basic_metric where name = 'crane-total-lifted-mass';"
            delay: 10 ms
        point Result.Winch1CharacteristicNumber:
            type: Real
            sql: "select value from public.rec_basic_metric where name = 'winch1-characteristic-number';"
            delay: 10 ms
        point Result.Winch2CharacteristicNumber:
            type: Real
            sql: "select value from public.rec_basic_metric where name = 'winch2-characteristic-number';"
            delay: 10 ms
        point Result.Winch3CharacteristicNumber:
            type: Real
            sql: "select value from public.rec_basic_metric where name = 'winch3-characteristic-number';"
            delay: 10 ms
        point Result.CraneCharacteristicNumber:
            type: Real
            sql: "select value from public.rec_basic_metric where name = 'crane-characteristic-number';"
            delay: 10 ms
        # sql Result.Val4:               # the name of result stored in the database, to be stored into the table column 'Result.Name2/result'
        #     sql: 'select Name2 from table_name'
        #     delay:  10ms                 # Optional delay, to be awaited before select apears


