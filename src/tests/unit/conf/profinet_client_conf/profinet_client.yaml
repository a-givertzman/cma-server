service ProfinetClient Ied01:
    cycle: 1 ms                         # operating cycle time of the module
    # in queue in-queue:
        # max-length: 10000
    subscribe: MultiQueue
    send-to: MultiQueue.in-queue
    protocol: 'profinet'
    description: 'S7-IED-01'
    ip: '192.168.100.243'
    rack: 0
    slot: 1
    db db222:                       # multiple DB blocks are allowed, must have unique namewithing parent device
        # description: 'db222 | Exhibit - drive data'
        number: 222
        offset: 0
        # size: 20
        point Drive.Speed: 
            type: 'Real'
            address:
                offset: 0
        point Drive.OutputVoltage: 
            type: 'Real'
            address:
                offset: 4
        point Drive.DCVoltage: 
            type: 'Real'
            address:
                offset: 8
        point Drive.Current: 
            type: 'Real'
            address:
                offset: 12
            history: read
        point Drive.Torque: 
            type: 'Real'
            address:
                offset: 16
    db db999:                       # multiple DB blocks are allowed, must have unique namewithing parent device
        description: 'db999 | Exhibit - drive data'
        number: 999
        offset: 0
        # size: 34
        point Drive.positionFromMru: 
            type: 'Real'
            address:
                offset: 20
        point Drive.positionFromHoist: 
            type: 'Real'
            address:
                offset: 24
        point Capacitor.Capacity: 
            type: 'Int'
            address:
                offset: 28
        point ChargeIn.On: 
            type: 'Bool'
            address:
                offset: 30
                bit: 0
        point ChargeOut.On: 
            type: 'Bool'
            address:
                offset: 32
                bit: 4
    db db888:
        description: 'db888 | Example'
        number: 888
        offset: 0
        # size: 6
        point Sensor.Real: 
            type: 'Real'
            address:
                offset: 0
        point Sensor.Int: 
            type: 'Int'
            address:
                offset: 4
