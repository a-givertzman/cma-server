        input373 fn Sql:
            sql: update public.rec_basic_metric set value = (COALESCE(NULLIF(value, ''), '0')::NUMERIC + {input.value})::TEXT where name = 'winch3-characteristic-number';
            input: winch3EigenValue
        #
        # 3.8  |  real  |  crane-load-spectrum-factor  |  коэффициент распределения нагрузок для крана
        # implemented in the database
        #
        # 3.8.1  |  real  |  winch1-load-spectrum-factor  |  коэффициент распределения нагрузок лебедка 1
        # implemented in the database
        #
        # 3.8.2  |  real  |  winch2-load-spectrum-factor  |  коэффициент распределения нагрузок лебедка 2
        # implemented in the database
        #
        # 3.8.3  |  real  |  winch3-load-spectrum-factor  |  коэффициент распределения нагрузок лебедка 3


    ###############   Operating Cycle + Metrics   ###############
    #
    #   table:      rec_operating_cycle
    #   table:      rec_operating_metric
    #
    fn RecOpCycleMetric OpCycle:
        send-to: /App/ApiClient.in-queue
        reset: opCycleIsStarted
        op-cycle: opCycleIsActive
        # conf point OpCycleSql:
        #     type: 'String'
        #
        # Operating cycle
        input01 fn Sql:
            sql: insert into public.rec_operating_cycle (id, timestamp_start, timestamp_stop, alarm_class) values ({opCycleId.value}, '{start.timestamp}', '{stop.timestamp}', {alarmClass.value});
            opCycleId: opCycleId
            start fn Hold:
                input fn Select:
                    select: opCycleIsStarted
                    input: craneLoad
            stop: craneLoad
            alarmClass: alarmClass
        #
        # Operating cycle metric 'Average Load'
        input02 fn Sql:
            sql: insert into public.rec_operating_metric (operating_cycle_id, metric_id, value) values ({opCycleId.value}, 'average_load', {input.value});
            opCycleId: opCycleId
            input: craneCycleAverageLoad
        #
        # Operating cycle metric 'Max Load'
        input03 fn Sql:
            sql: insert into public.rec_operating_metric (operating_cycle_id, metric_id, value) values ({opCycleId.value}, 'max_load', {input.value});
            opCycleId: opCycleId
            input: craneCycleMaxLoad


    ###############   Operating Cycle Events (Live Data)   ###############
    #
    #   table:      operating_event
    #
    #
    # Threshold for Crane load, used to compress leve data
    let craneLoadThreshold:
        input fn Mul:
            input1: craneLoadNom
            input2 fn PiecewiseLineApprox:
                input: craneLoadRelative
                piecewise:
                    0.0: 0.3
                    0.7: 0.1
                    0.85: 0.05
                    0.95: 0.01
                    1.0: 0.005
                    1.1: 0.001
    #
    # Crane load leve data compressed
    let craneLoadFiltered:
        input fn Threshold:
            threshold: craneLoadThreshold
            factor: const real 0.05
            input: craneLoad
    #
    # Threshold for Winch1 load, used to compress leve data
    let winch1LoadThreshold:
        input fn Mul:
            input1: winch1LoadNom
            input2 fn PiecewiseLineApprox:
                input: winch1LoadRelative
                piecewise:
                    0.0: 0.3
                    0.7: 0.1
                    0.85: 0.05
                    0.95: 0.01
                    1.0: 0.005
                    1.1: 0.001
    #
    # Winch1 load leve data compressed
    let winch1LoadFiltered:
        input fn Threshold:
            threshold: winch1LoadThreshold
            factor: const real 0.05
            input: winch1Load
    #
    # Threshold for Winch2 load, used to compress leve data
    let winch2LoadThreshold:
        input fn Mul:
            input1: winch2LoadNom
            input2 fn PiecewiseLineApprox:
                input: winch2LoadRelative
                piecewise:
                    0.0: 0.3
                    0.7: 0.1
                    0.85: 0.05
                    0.95: 0.01
                    1.0: 0.005
                    1.1: 0.001
    #
    # Winch2 load leve data compressed
    let winch2LoadFiltered:
        input fn Threshold:
            threshold: winch2LoadThreshold
            factor: const real 0.05
            input: winch2Load
    #
    # Threshold for Winch3 load, used to compress leve data
    let winch3LoadThreshold:
        input fn Mul:
            input1: winch3LoadNom
            input2 fn PiecewiseLineApprox:
                input: winch3LoadRelative
                piecewise:
                    0.0: 0.3
                    0.7: 0.1
                    0.85: 0.05
                    0.95: 0.01
                    1.0: 0.005
                    1.1: 0.001
    #
    # Winch3 load leve data compressed
    let winch3LoadFiltered:
        input fn Threshold:
            threshold: winch3LoadThreshold
            factor: const real 0.05
            input: winch3Load
