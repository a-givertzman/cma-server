                input2: const real 0.45
    #
    # Count of Crane cycles in load-range 0.45-0.55
    let craneLoadInRange_0_45_0_55:
        input fn And:
            input1: opCycleIsDone
            input2 fn Ge:
                input1: craneCycleAverageLoadRelative
                input2: const real 0.45
            input3 fn Lt:
