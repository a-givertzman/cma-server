service Task RecorderTask:
    wait-started: 100 ms
    retain:
        mode: debug
    cycle: 250 ms
    in queue recv-queue:
        max-length: 10000
    subscribe:
        /App/MultiQueue:                    # - multicast subscription to the MultiQueue
            Inf:                            # - on points having Cot::Inf
                - /App/ied13/db905_visual_data_fast/Winch1.LoadR0
                - /App/ied13/db905_visual_data_fast/Winch2.LoadR0
                - /App/ied13/db905_visual_data_fast/Winch3.LoadR0
                - /App/ied14/db906_visual_data/Winch1.Load
                - /App/ied14/db906_visual_data/Winch2.Load
                - /App/ied14/db906_visual_data/Winch3.Load
                - /App/ied14/db906_visual_data/Winch1.SWLProtection
                - /App/ied14/db906_visual_data/Winch2.SWLProtection
                - /App/ied14/db906_visual_data/Winch3.SWLProtection
                - /App/ied14/db906_visual_data/CraneMode.AOPS
                - /App/ied14/db906_visual_data/CraneMode.MOPS

    #
    # The nominal load of the crane, Ton
    let craneLoadNom:
        input: point real '/App/ied13/db905_visual_data_fast/Winch1.LoadR0' status ok # default 100000
    #
    # The nominal load of the Winch1, Ton
    let winch1LoadNom:
        input: point real '/App/ied13/db905_visual_data_fast/Winch1.LoadR0' status ok # default 100000
    #
    # The nominal load of the Winch2, Ton
    let winch2LoadNom:
        input: point real '/App/ied13/db905_visual_data_fast/Winch2.LoadR0' status ok # default 100000
    #
    # The nominal load of the Winch3, Ton
    let winch3LoadNom:
        input: point real '/App/ied13/db905_visual_data_fast/Winch3.LoadR0' status ok # default 100000
    #
    # The nominal load of the crane, Ton
    let craneLoad:
        input: point real '/App/ied14/db906_visual_data/Winch1.Load' status ok default 0.0
    #
    # The nominal load of the Winch1, Ton
    let winch1Load:
        input: point real '/App/ied14/db906_visual_data/Winch1.Load' status ok default 0.0
    #
    # The nominal load of the Winch2, Ton
    let winch2Load:
        input: point real '/App/ied14/db906_visual_data/Winch2.Load' status ok default 0.0
    #
    # The nominal load of the Winch3, Ton
    let winch3Load:
        input: point real '/App/ied14/db906_visual_data/Winch3.Load' status ok default 0.0
    #
    #
    let winch1LoadLimiterTrip:
        input: point bool '/App/ied14/db906_visual_data/Winch1.SWLProtection' status ok default false
    #
    #
    let winch2LoadLimiterTrip:
        input: point bool '/App/ied14/db906_visual_data/Winch2.SWLProtection' status ok default false
    #
    #
    let winch3LoadLimiterTrip:
        input: point bool '/App/ied14/db906_visual_data/Winch3.SWLProtection' status ok default false
    #
    # Crane AOPS triggered
    let craneAopsTriggered:
        input: point int '/App/ied14/db906_visual_data/CraneMode.AOPS' status ok default 0
    #
    # Crane MOPS triggered
    let craneMopsTriggered:
        input: point int '/App/ied14/db906_visual_data/CraneMode.MOPS' status ok default 0
    #
    # Crane load in relative units
    let craneLoadRelative:
        input fn Div:
            input1: craneLoad
            input2: craneLoadNom
    # Winch1 load in relative units
    let winch1LoadRelative:
        input fn Div:
            input1: winch1Load
            input2: winch1LoadNom
    # Winch2 load in relative units
    let winch2LoadRelative:
        input fn Div:
            input1: winch2Load
            input2: winch2LoadNom
    # Winch3 load in relative units
    let winch3LoadRelative:
        input fn Div:
            input1: winch3Load
            input2: winch3LoadNom
    #
    # 5 % of the nominal crane load - used for Op Cycle detection
    let opCycleThreshold:
        input fn Mul:
            input1: const real 0.05
            input2: craneLoadNom
    let winch1OpCycleThreshold:
        input fn Mul:
            input1: const real 0.05
            input2: winch1LoadNom
    let winch2OpCycleThreshold:
        input fn Mul:
            input1: const real 0.05
            input2: winch2LoadNom
    let winch3OpCycleThreshold:
        input fn Mul:
            input1: const real 0.05
            input2: winch3LoadNom
    let craneIsActive:
        input fn TimerOffDelay:
            delay: 5000ms
            input fn TimerOnDelay:
                delay: 5000ms
                input fn Ge:
                    input1 fn Threshold:                 # Triggering threshold of the operating cycle detection function on the input value based on the nominal value
                        threshold: opCycleThreshold
                        input: craneLoad
                    input2: opCycleThreshold
    let winch1IsActive:
        input fn TimerOffDelay:
            delay: 5000ms
            input fn TimerOnDelay:
                delay: 5000ms
                input fn Ge:
                    input1 fn Threshold:                 # Triggering threshold of the operating cycle detection function on the input value based on the nominal value
                        threshold: winch1OpCycleThreshold
                        input: winch1Load
                    input2: winch1OpCycleThreshold
    let winch2IsActive:
        input fn TimerOffDelay:
            delay: 5000ms
            input fn TimerOnDelay:
                delay: 5000ms
                input fn Ge:
                    input1 fn Threshold:                 # Triggering threshold of the operating cycle detection function on the input value based on the nominal value
                        threshold: winch2OpCycleThreshold
                        input: winch2Load
                    input2: winch2OpCycleThreshold
    let winch3IsActive:
        input fn TimerOffDelay:
            delay: 5000ms
            input fn TimerOnDelay:
                delay: 5000ms
                input fn Ge:
                    input1 fn Threshold:                 # Triggering threshold of the operating cycle detection function on the input value based on the nominal value
                        threshold: winch3OpCycleThreshold
                        input: winch3Load
                    input2: winch3OpCycleThreshold
    #
    # Detect if operating cycle is active (true - isActive, false - isNotActive)
    let opCycleIsActive:
        input fn Or:
            input0: craneIsActive
            input1: winch1IsActive  
            input2: winch2IsActive  # ОТКЛЮЧИ несущестующие лебедки что бы не заглушить opCycleIsActive !!!
            input3: winch3IsActive  # ОТКЛЮЧИ несущестующие лебедки что бы не заглушить opCycleIsActive !!!
    #
    # Returns one tic true if operating cycle is begins (isActive false -> true)
    let opCycleIsStarted:
        input fn RisingEdge:
            input: opCycleIsActive
    #
    # Returns one tic true if operating cycle is finished (isActive true -> false)
    let opCycleIsDone:
        input fn FallingEdge:
            # input fn Debug:
            input: opCycleIsActive
    #
    # Detect if pump is active (true - isActive, false - isNotActive)
    let pumpIsActive:
        input: opCycleIsActive
    #
    # Count the operating cycle ID (retained localy)
    let opCycleId:
        input fn Retain:
            key: 'OperatingCycleId'
            input fn Acc:
                initial fn Retain:
                    default: const int 0
                    key: 'OperatingCycleId'
                input fn Debug:
                    input: opCycleIsStarted
    #
    # Crane Average load in operating cycle, ??? unit ???
    let craneCycleAverageLoad:
        input fn Hold:
            input fn Average:
                reset: opCycleIsStarted
                input: craneLoad   # ??? unit ???
    #
    # Crane Average load in operating cycle in relative units
    let craneCycleAverageLoadRelative:
        input fn Div:
            input1: craneCycleAverageLoad
            input2: craneLoadNom
    #
    # Crane Max load in operating cycle, ??? unit ???
    let craneCycleMaxLoad:
        input fn Hold:
            input fn Max:
                reset: opCycleIsStarted
                input: craneLoad   # ??? unit ???
    # Winch1 Average load in operating cycle, ??? unit ???
    let winch1CycleAverageLoad:
        input fn Hold:
            input fn Average:
                reset: opCycleIsStarted
                input: winch1Load   # ??? unit ???
    #
    # Winch1 Average load in operating cycle in relative units
    let winch1CycleAverageLoadRelative:
        input fn Div:
            input1: winch1CycleAverageLoad
            input2: winch1LoadNom
    #
    # Winch2 Average load in operating cycle, ??? unit ???
    let winch2CycleAverageLoad:
        input fn Hold:
            input fn Average:
                reset: opCycleIsStarted
                input: winch2Load   # ??? unit ???
    #
    # Winch2 Average load in operating cycle in relative units
    let winch2CycleAverageLoadRelative:
        input fn Div:
            input1: winch2CycleAverageLoad
            input2: winch2LoadNom
    #
    # Winch3 Average load in operating cycle, ??? unit ???
    let winch3CycleAverageLoad:
        input fn Hold:
            input fn Average:
                reset: opCycleIsStarted
                input: winch3Load   # ??? unit ???
    #
    # Winch3 Average load in operating cycle in relative units
    let winch3CycleAverageLoadRelative:
        input fn Div:
            input1: winch3CycleAverageLoad
            input2: winch3LoadNom
    #
    # Alarm class of the operating cycle
    # Must be >0 if one of metric is alarmed
    let alarmClass:
        input fn PiecewiseLineApprox:
            piecewise:
                000.00: 0
                000.99: 0
                001.00: 1
                009.99: 1
                010.00: 2
                099.99: 2
                100.00: 4
                999.99: 4
            input fn Add:
                # Alarm class 1 - Emergency Event
                input1 fn Mul:
                    input1: const int 1
                    input2 fn ToInt:
                        input fn Or:
                            input1: winch1LoadLimiterTrip
                            input2: winch2LoadLimiterTrip
                            input3: winch3LoadLimiterTrip
                            # Overload > 25 %
                            input4 fn Ge:
                                input1: craneCycleMaxLoad
                                input2 fn Mul:
                                    input1: const real 1.25
                                    input2: craneLoadNom
                # Alarm class 2 - Warning Event
                input2 fn Mul:
                    input1: const int 10
                    input2 fn ToInt:
                        input fn Or:
                            # Overload in 10..25 %
                            input1 fn Ge:
                                input1: craneCycleMaxLoad
                                input2 fn Mul:
                                    input1: const real 1.10
                                    input2: craneLoadNom
                # Alarm class 2 - Importent Event
                # ...to be extended
    #
    # crane-characteristic-number  |  текущее характеристическое число для крана
    let craneEigenValue:
        input fn Retain:
            enable: opCycleIsDone
            key: 'crane-characteristic-number'
            input fn Add:
                input1 fn Pow:
                    input1 fn Div:
                        input1: craneCycleMaxLoad
                        input2: craneLoadNom
                    input2: const real 3.0
                input2 fn Retain:
                    default: const real 0.0
                    key: 'crane-characteristic-number'
    #
    # The duration of the crane operation cycle in seconds
    let craneOperatingCycleSecs:
        input fn Timer:
            reset: opCycleIsStarted
            input: opCycleIsActive
    #
    # winch1-characteristic-number  |  текущее характеристическое число лебедка 1
    let winch1EigenValue:
        input fn Retain:
            enable: opCycleIsDone
            key: 'winch1-characteristic-number'
            input fn Add:
                input1 fn Mul:
                    input1 fn Pow:
                        input1 fn Div:
                            input1: winch1CycleAverageLoad
                            input2: winch1LoadNom
                        input2: const real 3.0
                    input2: craneOperatingCycleSecs
                input2 fn Retain:
                    default: const real 0.0
                    key: 'winch1-characteristic-number'
    #
    # winch2-characteristic-number  |  текущее характеристическое число лебедка 2
    let winch2EigenValue:
        input fn Retain:
            enable: opCycleIsDone
            key: 'winch2-characteristic-number'
            input fn Add:
                input1 fn Mul:
                    input1 fn Pow:
                        input1 fn Div:
                            input1: winch2CycleAverageLoad
                            input2: winch2LoadNom
                        input2: const real 3.0
                    input2: craneOperatingCycleSecs
                input2 fn Retain:
                    default: const real 0.0
                    key: 'winch2-characteristic-number'
    #
    # winch3-characteristic-number  |  текущее характеристическое число лебедка 3
    let winch3EigenValue:
        input fn Retain:
            enable: opCycleIsDone
            key: 'winch3-characteristic-number'
            input fn Add:
                input1 fn Mul:
                    input1 fn Pow:
                        input1 fn Div:
                            input1: winch3CycleAverageLoad
                            input2: winch3LoadNom
                        input2: const real 3.0
                    input2: craneOperatingCycleSecs
                input2 fn Retain:
                    default: const real 0.0
                    key: 'winch3-characteristic-number'
    #
    # Count of Crane cycles in load-range 0.05-0.15
    let craneLoadInRange_0_05_0_15:
        input fn And:
            input1: opCycleIsDone
            input2 fn Ge:
                input1: craneCycleAverageLoadRelative
                input2: const real 0.05
            input3 fn Lt:
                input1: craneCycleAverageLoadRelative
                input2: const real 0.15
    #
    # Count of Crane cycles in load-range 0.15-0.25
    let craneLoadInRange_0_15_0_25:
        input fn And:
            input1: opCycleIsDone
            input2 fn Ge:
                input1: craneCycleAverageLoadRelative
                input2: const real 0.15
            input3 fn Lt:
                input1: craneCycleAverageLoadRelative
                input2: const real 0.25
    #
    # Count of Crane cycles in load-range 0.25-0.35
    let craneLoadInRange_0_25_0_35:
        input fn And:
            input1: opCycleIsDone
            input2 fn Ge:
                input1: craneCycleAverageLoadRelative
                input2: const real 0.25
            input3 fn Lt:
                input1: craneCycleAverageLoadRelative
                input2: const real 0.35
    #
    # Count of Crane cycles in load-range 0.35-0.45
    let craneLoadInRange_0_35_0_45:
