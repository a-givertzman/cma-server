[build]
# Вариант А: Оптимизация под конкретно ваш процессор (компилятор задействует все инструкции (AVX2, AVX-512, BMI2), которые поддерживает текущий процессор)
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-cpu=native"]


# Вариант Б: Если код будет запускаться на серверах с поддержкой AVX2 (более переносимый)
# rustflags = ["-C", "target-feature=+avx2"]