name: App
description: Short explanation / purpose etc.
services:
    retain:
        path: assets/retain/
        point:
            path: point/id.json
            api:
                table: public.tags
                address: 0.0.0.0:8080
                auth-token: 123!@#
                database: crane_data_server


service MultiQueue:
    wait-started: 50 ms         # optional, next service will wait until current completely started plus specified time
    in queue in-queue:
        max-length: 10000
    send-to:
        # - TaskTestReceiver.queue


service CacheService MainCache:
    retain: true
    retain-dely: 30s    # default 30s
    subscribe: 
        /App/MultiQueue: 
            Inf: []             # IMPORTENT !!!


service VirtualDevice VirtualIed15:
    # wait-started: 10 ms         # optional, next service will wait until current completely started plus specified time
    subscribe: /App/MultiQueue
        # /App/MultiQueue:
        #     Inf: []
                # - /App/TestTask/Result.Val1
                # - /App/TestTask/Result.Val2
                # - /App/TestTask/Result.Val3
                # - Result.Value4
    send-to: /App/MultiQueue.in-queue
    path: './Registrator-test-load.ods'            # Optional, if signal have to be charged from the table
    sheet: 'data'
    api:                                # Optional, if databese access for example required
        address: 127.0.0.1:8081
        database: crane_data_server
        auth-token: 123!@#
    inputs:                             # Input signal to be charged from the specified table file, or calculated in `Task`
        point /App/ied13/db905_visual_data_fast/Winch1.LoadR0: 
            type: Real
            history: rw
        point /App/ied13/db905_visual_data_fast/Winch2.LoadR0: 
            type: Real
            history: rw
        point /App/ied13/db905_visual_data_fast/Winch3.LoadR0: 
            type: Real
            history: rw
        point /App/ied14/db906_visual_data/Winch1.Load: 
            type: Real
            history: rw
        point /App/ied14/db906_visual_data/Winch2.Load: 
            type: Real
            history: rw
        point /App/ied14/db906_visual_data/Winch3.Load: 
            type: Real
            history: rw
        point /App/ied14/db906_visual_data/Winch1.SWLProtection: 
            type: Bool
            history: rw
        point /App/ied14/db906_visual_data/Winch2.SWLProtection: 
            type: Bool
            history: rw
        point /App/ied14/db906_visual_data/Winch3.SWLProtection: 
            type: Bool
            history: rw
        point /App/ied14/db906_visual_data/CraneMode.AOPS: 
            type: Int
            history: rw
        point /App/ied14/db906_visual_data/CraneMode.MOPS: 
            type: Int
            history: rw
    results:
        # point Result.Val1:             # the name of calculated result to be stored into the table column 'Result.Name1/result'
        #     type: Real
        # point Result.Val2:             # the name of calculated result to be stored into the table column 'Result.Name1/result'
        #     type: Real
        # sql Result.Val3:             # the name of calculated result to be stored into the table column 'Result.Name1/result'
        #     type: Int
        #     sql: 'select value from public.frdm_settings;'
        #     delay: 10 ms
            # sql: 'select id, value from public.frdm_settings;'
            # type: Real
        # sql Result.Val4:               # the name of result stored in the database, to be stored into the table column 'Result.Name2/result'
        #     sql: 'select Name2 from table_name'
        #     delay:  10ms                 # Optional delay, to be awaited before select apears
        sql winch1CycleAverageLoad:               # the name of result stored in the database, to be stored into the table column 'Result.Name2/result'
            type: Real
            sql: "select value from rec_basic_metric where name = 'winch1-total-lifted-mass';"
            delay:  10ms                 # Optional delay, to be awaited before select apears


