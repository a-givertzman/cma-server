name: App
description: Short explanation / purpose etc.
services:
    retain:
        path: assets/retain/
        point:
            path: point/id.json
            api:
                table: public.tags
                address: 0.0.0.0:8080
                auth-token: 123!@#
                database: crane_data_server


service MultiQueue:
    wait-started: 50 ms         # optional, next service will wait until current completely started plus specified time
    in queue in-queue:
        max-length: 10000
    send-to:
        # - TaskTestReceiver.queue


service CacheService MainCache:
    retain: true
    retain-dely: 30s    # default 30s
    subscribe: 
        /App/MultiQueue: 
            Inf: []             # IMPORTENT !!!


service VirtualDevice VirtualIed15:
    # wait-started: 10 ms         # optional, next service will wait until current completely started plus specified time
    subscribe: /App/MultiQueue
        # /App/MultiQueue:
        #     Inf: []
                # - /App/TestTask/Result.Val1
                # - /App/TestTask/Result.Val2
                # - /App/TestTask/Result.Val3
                # - Result.Value4
    send-to: /App/MultiQueue.in-queue
    path: './test-ied15.ods'            # Optional, if signal have to be charged from the table
    sheet: 'data'
    api:                                # Optional, if databese access for example required
        address: 0.0.0.0:8080
        auth-token: 123!@#
        database: crane_data_server
    inputs:                             # Input signal to be charged from the specified table file, or calculated in `Task`
        point Winch.Valve1: 
            type: Real
            history: rw
        point Winch.Valve2: 
            type: Real
            history: rw
    results:
        point Result.Val1:             # the name of calculated result to be stored into the table column 'Result.Name1/result'
            type: Real
        point Result.Val2:             # the name of calculated result to be stored into the table column 'Result.Name1/result'
            type: Real
        point Result.Val3:             # the name of calculated result to be stored into the table column 'Result.Name1/result'
            type: Real
        # sql Result.Val4:               # the name of result stored in the database, to be stored into the table column 'Result.Name2/result'
        #     sql: 'select Name2 from table_name'
        #     delay:  10ms                 # Optional delay, to be awaited before select apears


service Task TestTask:
    cycle: 1 ms
    in queue recv-queue:
        max-length: 10000
    subscribe: 
        /App/MultiQueue:                 # - multicast subscription to the MultiQueue
            # {cot: Inf, ...}: []               #   - on all points having Cot::Inf and history::ReadWrite
            Inf: []               #   - on all points having Cot::Inf and history::ReadWrite
    # fn Debug:
    #     input: point any every
    fn Export ExportResultVal1:
        enable: const bool true
        send-to: /App/MultiQueue.in-queue
        conf point Result.Val1:
            type: Real
        input fn Add:
            input1: point real /App/VirtualIed15/Winch.Valve1
            input2: point real /App/VirtualIed15/Winch.Valve2
    fn Export ExportResultVal2:
        enable: const bool true
        send-to: /App/MultiQueue.in-queue
        conf point Result.Val2:
            type: Real
        input fn Mul:
            input1: point real /App/VirtualIed15/Winch.Valve1
            input2: point real /App/VirtualIed15/Winch.Valve2



