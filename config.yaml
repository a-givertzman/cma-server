service Task HistoryTask:
    wait-started: 100 ms         # optional, next service will wait until current completely started plus specified time
    cycle: 1 s
    in queue recv-queue:
        max-length: 10000
    subscribe:
        /App/MultiQueue:                     # - multicast subscription to the MultiQueue
            {cot: Inf, history: rw}: []               #   - on all points having Cot::Inf and history::ReadWrite
    # fn Debug:
    #     input: point any every
    fn ToApiQueue:
        queue: /App/ApiClient.in-queue
        input fn Sql:
            sql: "insert into public.event (pid,value,status,timestamp) values ({input2.value},{input1.value},{input1.status},'{input1.timestamp}');"
            input1 fn ToInt:
                input: point any every      # point: every point of any type
            input2 fn PointId:
                input: point any every


