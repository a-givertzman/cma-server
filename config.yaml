name: App
description: Short explanation / purpose etc.
services:
    retain:
        path: assets/retain/
        point:
            path: point/id.json
            api:
                table: public.tags
                address: 0.0.0.0:8080
                auth-token: 123!@#
                database: crane_data_server


service MultiQueue:
    wait-started: 100 ms         # optional, next service will wait until current completely started plus specified time
    in queue in-queue:
        max-length: 10000
    send-to:
        # - TaskTestReceiver.queue


service CacheService MainCache:
    wait-started: 100 ms         # optional, next service will wait until current completely started plus specified time
    retain: true
    retain-dely: 30s    # default 30s
    subscribe:
        /App/MultiQueue:
            Inf: []             # IMPORTENT !!!

